[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minemap"
version = "0.1.0"
description = "Build mod-compatible real-world Minecraft maps from a coordinate bounding box"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "requests>=2.31",
    "nbtlib>=2.0",
    "pyshp>=2.3",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.6"]

[project.scripts]
minemap = "minemap.__main__:main"

[tool.setuptools.packages.find]
include = ["minemap*"]

[tool.setuptools.package-data]
minemap = ["web/*", "pipeline/templates/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
