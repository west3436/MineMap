name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build exe
        run: pyinstaller minemap.spec --noconfirm --clean
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/MineMap -DestinationPath MineMap-windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineMap-windows
          path: MineMap-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MineMap-windows.zip
          generate_release_notes: true
